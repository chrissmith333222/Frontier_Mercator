<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Abstract globe with latitude/longitude grid -- reads as "world map/reach" without a literal continent tracing -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <ellipse cx="50" cy="50" rx="42" ry="14" fill="none" stroke="#9AA5B4" stroke-width="1"/>
  <ellipse cx="50" cy="50" rx="42" ry="28" fill="none" stroke="#9AA5B4" stroke-width="1"/>
  <ellipse cx="50" cy="50" rx="14" ry="42" fill="none" stroke="#9AA5B4" stroke-width="1"/>
  <ellipse cx="50" cy="50" rx="28" ry="42" fill="none" stroke="#9AA5B4" stroke-width="1"/>
  <line x1="8" y1="50" x2="92" y2="50" stroke="#505F79" stroke-width="1"/>
  <line x1="50" y1="8" x2="50" y2="92" stroke="#505F79" stroke-width="1"/>
  <!-- three location pins referencing the core mandate regions (Africa/LatAm/extended) -->
  <circle cx="46" cy="42" r="2.6" fill="#D4AA04"/>
  <circle cx="33" cy="60" r="2.6" fill="#D4AA04"/>
  <circle cx="64" cy="55" r="2.6" fill="#D4AA04"/>
</svg>
